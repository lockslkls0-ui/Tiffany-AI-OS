name: tiffany-ai-os
title: Tiffany AI-OS
base: core24
version: "48.6"
summary: Assistant IA Hybride, Vocal et Souverain pour Linux
description: |
  Tiffany AI-OS pilote votre PC Linux en temps reel avec 4 niveaux d intelligence locale.
license: GPL-3.0
contact: https://github.com
website: https://github.com
source-code: https://github.com
issues: https://github.com/issues
grade: stable
confinement: classic

lint:
  ignore:
    - classic
    - library

apps:
  tiffany-ai-os:
    command: bin/bash $SNAP/tiffany/tiffany_menu.sh

parts:
  tiffany:
    plugin: dump
    source: .
    organize:
      '*': tiffany/
    stage:
      - -tiffany/parts
      - -tiffany/stage
      - -tiffany/prime
      - -tiffany/snap
      - -tiffany/.git
      - -tiffany/backup

  voice-piper:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/tiffany/voice"
      BASE_URL="https://huggingface.co"
      curl -fL "$BASE_URL/low/fr_FR-siwis-low.onnx" -o "$CRAFT_PART_INSTALL/tiffany/voice/fr_FR-siwis-low.onnx"
      curl -fL "$BASE_URL/low/fr_FR-siwis-low.onnx.json" -o "$CRAFT_PART_INSTALL/tiffany/voice/fr_FR-siwis-low.onnx.json"
      curl -fL "$BASE_URL/medium/fr_FR-siwis-medium.onnx" -o "$CRAFT_PART_INSTALL/tiffany/voice/fr_FR-siwis-medium.onnx"
      curl -fL "$BASE_URL/medium/fr_FR-siwis-medium.onnx.json" -o "$CRAFT_PART_INSTALL/tiffany/voice/fr_FR-siwis-medium.onnx.json"
      ln -sf fr_FR-siwis-low.onnx "$CRAFT_PART_INSTALL/tiffany/voice/voix_active.onnx"
      ln -sf fr_FR-siwis-low.onnx.json "$CRAFT_PART_INSTALL/tiffany/voice/voix_active.onnx.json"

  voice-vosk:
    plugin: nil
    build-packages:
      - curl
      - unzip
      - ca-certificates
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/tiffany/voice/vosk-fr"
      curl -fL "https://alphacephei.com" -o /tmp/vosk.zip
      unzip -q /tmp/vosk.zip -d /tmp/vosk_extract
      mv /tmp/vosk_extract/vosk-model-small-fr-0.22/* "$CRAFT_PART_INSTALL/tiffany/voice/vosk-fr/"
      rm -rf /tmp/vosk.zip /tmp/vosk_extract
