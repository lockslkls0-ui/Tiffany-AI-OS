name: tiffany-ai-os
title: Tiffany AI-OS
base: core24
version: "48.6"
summary: Assistant IA Hybride, Vocal et Souverain pour Linux
description: |
  Tiffany AI-OS pilote votre PC Linux en temps reel avec 4 niveaux d intelligence locale.
license: GPL-3.0
contact: https://github.com
website: https://github.com
source-code: https://github.com
issues: https://github.com/issues
grade: stable
confinement: classic

lint:
  ignore:
    - classic
    - library

apps:
  tiffany-ai-os:
    command: bin/bash $SNAP/tiffany/tiffany_menu.sh

parts:
  tiffany:
    plugin: dump
    source: .
    organize:
      '*': tiffany/
    stage:
      - -tiffany/parts
      - -tiffany/stage
      - -tiffany/prime
      - -tiffany/snap
      - -tiffany/.git
      - -tiffany/backup
